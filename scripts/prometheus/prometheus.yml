global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: apihub-dev
    env: dev

# 告警规则：按 P0/P1/P2 + 子系统分文件（详见 rules/）
rule_files:
  - rules/*.yml

# Alertmanager：本地 dev 用 docker compose 起；prod 走独立 K8s deployment
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # 业务服务（自动发现）
  - job_name: apihub-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: name
            values: ["apihub-.*"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(apihub-.*)'
        target_label: container
      # Prometheus 端口约定：业务 Pod 暴露 9090
      - source_labels: [__address__]
        target_label: __metrics_path__
        replacement: /metrics

  # OTel Collector 自身指标
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # ===== 基础设施 exporter（docker-compose.dev.yml 同名服务）=====
  # infra.yml 的告警全部依赖这四个 job 的指标；此前只有一个指向 broker 9092 的
  # "kafka" job（不是 exporter，无 /metrics）→ 基础设施告警从未可能触发。
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
