# prod-bj 数据层连接配置（ConfigMap 部分）。
# ⚠️ Secret 部分（apihub-shared-secret/hmac-key）已迁至同目录 external-secrets.yaml
# （ESO + 阿里云 KMS；此前 REPLACE_ME 占位 + ArgoCD selfHeal 会回滚手工填值）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: apihub-shared-infra-bj
  namespace: apihub-system
data:
  HOME_REGION: "bj"
  PG_HOST: "pg-bj.internal"
  PG_PORT: "5432"
  PG_USER: "apihub_app"
  PG_DATABASE: "apihub"
  PG_SSL: "verify-full"
  PG_POOL_MIN: "10"
  PG_POOL_MAX: "50"
  REDIS_HOST: "redis-bj.internal"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-bj-1:9092,kafka-bj-2:9092,kafka-bj-3:9092"
  CH_HOST: "ch-bj.internal"
  CH_PORT: "8123"
  CH_USERNAME: "apihub"
  PEER_REGION_CH_HOST: "ch-sh.internal"
  PEER_REGION_CH_USER: "default"
  GATEWAY_URL_SH: "https://api-sh.apihub.com"
  GATEWAY_URL_BJ: "https://api-bj.apihub.com"
  MULTI_REGION_ACTIVE: "1"                      # C-T1 guard：un-gate Go quota splitRatio（与 prod-sh 对称，缺则 bj=100% → 双活超量 1.6×）
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.apihub-monitoring:4317"
  QUOTA_REGION_SPLIT_RATIO: "0.4"
  PEER_QUOTA_REGION_SPLIT_RATIO: "0.6"
