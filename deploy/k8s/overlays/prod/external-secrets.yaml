# prod Secret 供给：External Secrets Operator（ESO）+ 阿里云 KMS 凭据管家。
#
# 为什么不用 inline Secret：ArgoCD 开了 selfHeal+prune，手工 apply 填进 REPLACE_ME
# 的真值会被 Git 状态立刻回滚；把真值提交进 Git 又泄漏。ESO 让 Git 只管「映射」
# （哪个 KMS 键 → 哪个 Secret 字段），值留在 KMS。
#
# 前置（见 deploy/k8s/base/external-secrets/README.md）：
#   1. 集群装 ESO controller（v0.9.19+，含 alibaba provider）
#   2. KMS 凭据管家创建 apihub/prod/* 与 apihub/shared/hmac_secret_key
#   3. 创建 alicloud-eso-credentials Secret（只读 KMS 的 RAM 子账号 AK）
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: alibaba-kms-sh
spec:
  provider:
    alibaba:
      region: cn-shanghai
      auth:
        # 生产建议换 RRSA（ACK 角色，免静态 AK）：provider.rrsa.{roleArn,oidcProviderArn}
        secretRef:
          accessKeySecretRef:
            name: alicloud-eso-credentials
            key: access-key-id
          accessKeySecretSecretRef:
            name: alicloud-eso-credentials
            key: access-key-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: apihub-shared-secret-prod
  namespace: apihub-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: alibaba-kms-sh
  target:
    name: apihub-shared-secret-prod
    creationPolicy: Owner
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: apihub/prod/pg_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: apihub/prod/jwt_secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: apihub/prod/redis_password
    - secretKey: CH_PASSWORD
      remoteRef:
        key: apihub/prod/ch_password
    - secretKey: NOTIFICATION_SMTP_PASSWORD
      remoteRef:
        key: apihub/shared/smtp_password
    # 对端 Region CH 凭据（原在 ConfigMap 里占位——密码不进 CM；envFrom 里 Secret 在后生效）
    - secretKey: PEER_REGION_CH_PASSWORD
      remoteRef:
        key: apihub/shared/peer_ch_password_bj
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: apihub-hmac-key-prod
  namespace: apihub-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: alibaba-kms-sh
  target:
    # 名字必须是 apihub-hmac-key（auth/dispatcher/notification 的 envFrom 引用此名）
    name: apihub-hmac-key
    creationPolicy: Owner
  data:
    # HMAC envelope key 跨 Region 同值（prod/prod-bj webhook 验签一致）→ 用 shared/ 命名
    - secretKey: hmac_secret_key
      remoteRef:
        key: apihub/shared/hmac_secret_key
