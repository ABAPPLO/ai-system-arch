apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: apihub-system
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: apihub
data:
  APP_NAME: notification
  ENV: dev
  LOG_LEVEL: INFO
  PG_HOST: apihub-rds.internal
  PG_PORT: "5432"
  PG_DATABASE: apihub
  PG_POOL_MIN: "5"
  PG_POOL_MAX: "20"
  REDIS_HOST: apihub-redis.internal
  REDIS_PORT: "6379"
  KAFKA_BROKERS: apihub-kafka-1:9092,apihub-kafka-2:9092,apihub-kafka-3:9092
  KAFKA_TOPIC_CALL_EVENTS: api-call-events
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.apihub-monitoring:4317
  OTEL_SERVICE_NAME: notification
  # 验证邮件等平台发信（钉钉企业邮箱 SMTP；密码 NOTIFICATION_SMTP_PASSWORD 走 shared-secret）
  NOTIFICATION_SMTP_HOST: "smtp.qiye.aliyun.com"
  NOTIFICATION_SMTP_PORT: "465"
  NOTIFICATION_SMTP_USE_TLS: "true"
  NOTIFICATION_SMTP_FROM_ADDR: "noreply@apihub.com"
  NOTIFICATION_SMTP_USER: "noreply@apihub.com"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  namespace: apihub-system
type: Opaque
# 真实环境用 Sealed Secrets 加密，这里仅占位
# stringData:
#   PG_PASSWORD: ...
